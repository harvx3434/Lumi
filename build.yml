name: Build Lumi
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/lumi/assistant
          mv *.kt app/src/main/java/com/lumi/assistant/
          mv AndroidManifest.xml app/src/main/
          mv app_build.gradle.kts app/build.gradle.kts
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > local.properties
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lumi-apk
          path: app/build/outputs/apk/debug/app-debug.apk
